<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diffusion Models Independent Study</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#fbfaf8; --card:#fff; --sunk:#f2efe9;
    --ink:#1a1918; --ink-2:#56524a; --ink-3:#8b8780;
    --rule:#e3e0da; --rule-2:#cfcbc3; --accent:#6b4fbb;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#111216; --card:#1a1c21; --sunk:#22252b;
      --ink:#eceaf0; --ink-2:#b3b0ba; --ink-3:#7e7b87;
      --rule:#2c2f36; --rule-2:#3c4048; --accent:#a58bef;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111216; --card:#1a1c21; --sunk:#22252b;
    --ink:#eceaf0; --ink-2:#b3b0ba; --ink-3:#7e7b87;
    --rule:#2c2f36; --rule-2:#3c4048; --accent:#a58bef;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:56px 20px 80px}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.92em}
  h1{font-size:clamp(26px,4.4vw,38px);line-height:1.15;margin:0 0 14px;letter-spacing:-.02em;font-weight:660}
  .lede{color:var(--ink-2);margin:0 0 6px;font-size:17px}
  .meta{color:var(--ink-3);font-size:14px;margin:18px 0 0}
  .meta a{color:var(--ink-2)}
  hr{border:0;border-top:1px solid var(--rule);margin:36px 0}
  .cards{display:grid;gap:14px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--rule);border-radius:14px;padding:18px 20px;transition:border-color .15s,transform .15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .tag{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:650}
  a.card h2{font-size:19px;margin:5px 0 7px;font-weight:620;letter-spacing:-.01em}
  a.card p{margin:0;color:var(--ink-2);font-size:14.5px}
  .feature{background:linear-gradient(180deg,var(--card),var(--sunk))}
  .kbd{display:inline-block;background:var(--sunk);border:1px solid var(--rule-2);border-radius:5px;
    padding:1px 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--ink-2)}
  h3{font-size:15px;margin:30px 0 8px;font-weight:640}
  p.small{font-size:14.5px;color:var(--ink-2);margin:0 0 10px}
  ul{padding-left:20px;color:var(--ink-2);font-size:14.5px;margin:0}
  li{margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap">

  <h1>Diffusion Models — Independent Study</h1>

  <div class="cards" style="margin-top:28px">

    <a class="card feature" href="slide.html">
      <div class="tag">Presentation</div>
      <h2>All three pitfalls — one 16:9 slide</h2>
      <p>Tabbed, fullscreen-ready, keyboard driven. <span class="kbd">←</span> <span class="kbd">→</span> switch · <span class="kbd">space</span> pause · <span class="kbd">a</span> anneal · <span class="kbd">r</span> reset · <span class="kbd">f</span> fullscreen. This is the one to project.</p>
    </a>

  </div>

</div>
</body>
</html>
